# Explicitly enabled OAuth2/OIDC deployments use these defaults before Magic resources are loaded.
idaas.protocol.issuer=http://localhost:8088
idaas.protocol.login-url=http://localhost:3005/#/auth/identity/login
idaas.protocol.consent-path=/idaas/oauth2/consent
idaas.protocol.endpoints.authorization=/idaas/oauth2/authorize
idaas.protocol.endpoints.token=/idaas/oauth2/token
idaas.protocol.endpoints.introspection=/idaas/oauth2/introspect
idaas.protocol.endpoints.revocation=/idaas/oauth2/revoke
idaas.protocol.endpoints.jwks=/idaas/oauth2/jwks
idaas.protocol.endpoints.userinfo=/idaas/connect/userinfo
idaas.protocol.endpoints.logout=/idaas/connect/logout

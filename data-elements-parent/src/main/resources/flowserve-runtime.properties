# FlowServe node-to-node management protocol, loaded in Nacos and file modes.
flowserve.runtime.protocol-base-path=/api/v1/runtime
flowserve.runtime.protocol-health-path=/health
flowserve.runtime.protocol-deploy-path=/deploy
# Older deployments use the terminal segment when the Magic group has no published segment attribute.
flowserve.runtime.public-prefix=/dws/flowserve/published

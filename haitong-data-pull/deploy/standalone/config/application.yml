# ================= Windows 独立部署直填配置 =================
# 日常只修改本文件，保存后重新执行 scripts\start-standalone.cmd 即可。
# 本包不再需要 standalone-env.cmd，也不读取 HAITONG_* 系统环境变量。
# 下方尖括号风格的示例值必须替换为实际值；密码含 #、:、! 等字符时必须保留双引号。

server:
  address: 0.0.0.0
  port: 18083

magic-api:
  web: /api/web
  resource:
    # Magic 接口脚本存储于本配置 db 指向的 haitong.ht_magic_api_file 表。
    type: database
    table-name: ht_magic_api_file
    prefix: /magic-api
  security:
    username: haitong-admin
    password: "REPLACE_WITH_STRONG_MAGIC_EDITOR_PASSWORD"

db:
  type: mysql
  host: "REPLACE_WITH_MYSQL_HOST"
  port: 3306
  name: haitong
  username: "REPLACE_WITH_MYSQL_USERNAME"
  password: "REPLACE_WITH_MYSQL_PASSWORD"
  # 通常留空；仅在使用专用 JDBC URL 时填写。
  url: ""
  pool-size: 10
  init-schema: false

relay:
  work-dir: ./data

  # 独立模式不访问数据元素平台 8088；允许的契约来自本机 MySQL 镜像表。
  registration-registry:
    enabled: false

  standalone-registry:
    sync-enabled: true
    # 数据元素平台调用 REGISTRY_SYNC 时使用；不得与推送密钥复用。
    sync-key: "REPLACE_WITH_LONG_RANDOM_REGISTRY_SYNC_KEY"

  standalone:
    datasources: {}

  security:
    requests-per-minute: 600
    clients:
      standalone-publisher:
        # 业务系统请求 POST /api/v1/data-push 时的 X-Api-Key。
        api-key: "REPLACE_WITH_LONG_RANDOM_PUSH_KEY"
        channels: [table-to-ftp]
        actions: []

  zero-trust-gateway:
    enabled: false
    token-url: ""
    push-url: ""
    client-id: ""
    client-secret: ""
    requester-ip: ""
    timeout-seconds: 30
    audit-defaults: {}

  ftp:
    enabled: true
    # 普通 FTP：FTP / 通常 21；SFTP：SFTP / 通常 22。两者不能混用。
    protocol: FTP
    host: "REPLACE_WITH_FTP_HOST"
    port: 21
    username: "REPLACE_WITH_FTP_USERNAME"
    password: "REPLACE_WITH_FTP_PASSWORD"
    passive: true
    implicit-tls: false
    encoding: UTF-8
    timeout-seconds: 30
    # FTP 服务端目录，最终文件：<output-dir>/<datasourceId>/<tableName>/<messageId>.json。
    output-dir: "/REPLACE_WITH_FTP_OUTPUT_DIRECTORY"

  kafka:
    enabled: false

  targets:
    ftp:
      type: FTP
      directory: ""
    table-log:
      type: LOG

  routes:
    table-to-ftp:
      enabled: true
      registration-managed: false
      targets: [ftp]
      file-format: JSONL
      required-fields: [tableName, records]
      batch-key-field: batchId
      business-time-field: occurredAt
    table-to-kafka:
      enabled: false
      registration-managed: false
      targets: []
    table-to-log:
      enabled: false
      targets: [table-log]

  worker:
    enabled: true
    threads-per-type: 2
    max-attempts: 10
    poll-ms: 500
    lease-seconds: 300
    file-batch-size: 100

# Linux 独立部署模板。密码、接口密钥及账号只允许从 systemd 的环境文件读取。
# 请复制 config/haitong-data-pull.env.example 为 config/haitong-data-pull.env 后填写，
# 并将其权限设为 0640（属主 root、属组为运行服务组）。
server:
  address: "${HAITONG_BIND_ADDRESS:0.0.0.0}"
  port: "${HAITONG_PORT:18083}"

# Magic-API 编辑器。接口脚本存储在本配置 db 指向的 haitong.ht_magic_api_file 表。
# 不使用 data/magic-api 文件夹。
magic-api:
  web: /api/web
  resource:
    type: database
    table-name: ht_magic_api_file
    prefix: /magic-api
  security:
    username: "${HAITONG_MAGIC_EDITOR_USERNAME:haitong-admin}"
    password: "${HAITONG_MAGIC_EDITOR_PASSWORD}"

db:
  type: mysql
  host: "${HAITONG_DB_HOST}"
  port: "${HAITONG_DB_PORT:3306}"
  name: "${HAITONG_DB_NAME:haitong}"
  username: "${HAITONG_DB_USER:haitong_app}"
  password: "env:HAITONG_DB_PASSWORD"
  # 留空时按 host/port/name 自动生成 JDBC URL；隔离网络可显式设置 HAITONG_DB_URL。
  url: "${HAITONG_DB_URL:}"
  pool-size: "${HAITONG_DB_POOL_SIZE:10}"
  init-schema: false

relay:
  work-dir: "${HAITONG_WORK_DIR:./data}"

  # 独立运行模式：不访问数据元素平台 8088 的在线登记核验服务。
  registration-registry:
    enabled: false

  # 可由数据元素平台以 REGISTRY_SYNC 动作同步允许的数据源、表和字段到本地库。
  standalone-registry:
    sync-enabled: true
    sync-key: "env:HAITONG_STANDALONE_REGISTRY_SYNC_KEY"

  standalone:
    datasources: {}

  security:
    requests-per-minute: "${HAITONG_REQUESTS_PER_MINUTE:600}"
    clients:
      standalone-publisher:
        api-key: "env:HAITONG_STANDALONE_PUSH_KEY"
        channels: [table-to-ftp]
        actions: []

  # 如不使用零信任网关，请保持 false；凭据均由环境文件提供。
  zero-trust-gateway:
    enabled: "${HAITONG_ZERO_TRUST_ENABLED:false}"
    token-url: "${HAITONG_ZERO_TRUST_TOKEN_URL:}"
    push-url: "${HAITONG_ZERO_TRUST_PUSH_URL:}"
    client-id: "${HAITONG_ZERO_TRUST_CLIENT_ID:}"
    client-secret: "env:HAITONG_ZERO_TRUST_CLIENT_SECRET"
    requester-ip: "${HAITONG_ZERO_TRUST_REQUESTER_IP:}"
    timeout-seconds: "${HAITONG_ZERO_TRUST_TIMEOUT_SECONDS:30}"
    audit-defaults: {}

  ftp:
    enabled: true
    # FTP 使用 FTP / 21；使用 SFTP 时应改为 SFTP / 22，勿只改其中一个。
    protocol: "${HAITONG_FTP_PROTOCOL:FTP}"
    host: "${HAITONG_FTP_HOST}"
    port: "${HAITONG_FTP_PORT:21}"
    username: "${HAITONG_FTP_USERNAME}"
    password: "env:HAITONG_FTP_PASSWORD"
    passive: "${HAITONG_FTP_PASSIVE:true}"
    implicit-tls: "${HAITONG_FTP_IMPLICIT_TLS:false}"
    encoding: "${HAITONG_FTP_ENCODING:UTF-8}"
    timeout-seconds: "${HAITONG_FTP_TIMEOUT_SECONDS:30}"
    # 服务会在此目录下写入 <datasourceId>/<tableName>/<messageId>.json 与 .done。
    output-dir: "${HAITONG_FTP_OUTPUT_DIR}"

  kafka:
    enabled: false

  targets:
    ftp:
      type: FTP
      directory: ""
    table-log:
      type: LOG

  routes:
    table-to-ftp:
      enabled: true
      registration-managed: false
      targets: [ftp]
      file-format: JSONL
      required-fields: [tableName, records]
      batch-key-field: batchId
      business-time-field: occurredAt
    table-to-kafka:
      enabled: false
      registration-managed: false
      targets: []
    table-to-log:
      enabled: false
      targets: [table-log]

  worker:
    enabled: true
    threads-per-type: "${HAITONG_WORKER_THREADS_PER_TYPE:2}"
    max-attempts: "${HAITONG_WORKER_MAX_ATTEMPTS:10}"
    poll-ms: "${HAITONG_WORKER_POLL_MS:500}"
    lease-seconds: "${HAITONG_WORKER_LEASE_SECONDS:300}"
    file-batch-size: "${HAITONG_WORKER_FILE_BATCH_SIZE:100}"

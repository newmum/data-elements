# 片段：放入已有 HTTPS server {} 内，不是完整 nginx.conf。
# 前提：网关与本服务同主机。异机替换 proxy_pass 中的内部地址，并收紧防火墙。
# relay.gateway.public-base-url 应填写 https://你的网关域名/relay。
location /relay/api/ {
    client_max_body_size 101m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    proxy_pass http://127.0.0.1:18083/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header Authorization $http_authorization;
    # 剥离客户端伪造的附加头。启用 shared-key 时改为服务端安全注入的固定值。
    proxy_set_header X-Gateway-Key "";
    proxy_set_header X-Admin-Key "";
}
location /relay/internal/ { return 404; }
location /relay/actuator/ { return 404; }
# 此处不代替现有网关的证书、来源认证、限流、访问日志脱敏和防火墙策略。

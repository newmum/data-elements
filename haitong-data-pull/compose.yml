# 仅启动本应用；不会另建 Kafka、FTP 或数据库服务。
services:
  haitong-data-pull:
    build: .
    image: haitong-data-pull:1.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:18083"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # 使用 env: 密钥时，必须在这里显式传入容器，例如：
      # FTP_PASSWORD: ${FTP_PASSWORD:?Please set FTP_PASSWORD}
    volumes:
      - ./config:/app/config:ro
      - ./lib:/app/lib:ro
      - relay-data:/app/data
      - relay-logs:/app/logs
    stop_grace_period: 150s
volumes:
  relay-data:
  relay-logs:

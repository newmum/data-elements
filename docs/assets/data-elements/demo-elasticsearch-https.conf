# Include in nginx's http block. Reuse the demo IP certificate and renewal hook.
upstream demo_elasticsearch_http {
    server 127.0.0.1:19201;
    keepalive 16;
}

server {
    listen 19200 ssl;
    server_name 14.103.233.56;

    ssl_certificate /etc/nginx/tls/14.103.233.56/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/14.103.233.56/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DEMO_ES_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Existing backend clients still use HTTP on 19200. A named error handler
    # preserves their method/body and Elasticsearch's original authentication.
    # New clients should use HTTPS; removing compatibility requires migrating them first.
    error_page 497 = @legacy_elasticsearch_http;

    location / {
        proxy_pass http://demo_elasticsearch_http;
    }

    location @legacy_elasticsearch_http {
        proxy_pass http://demo_elasticsearch_http;
    }
}

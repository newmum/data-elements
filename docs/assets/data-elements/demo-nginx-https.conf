# Include inside the existing demo application server block.
# HTTP-01 stays available on port 80; HTTPS reuses the same application locations.
listen 443 ssl;
ssl_certificate /etc/nginx/tls/14.103.233.56/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/14.103.233.56/privkey.pem;
ssl_protocols TLSv1.2;
ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:DEMO_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

location ^~ /.well-known/acme-challenge/ {
    root /var/lib/acme;
    default_type text/plain;
    try_files $uri =404;
}

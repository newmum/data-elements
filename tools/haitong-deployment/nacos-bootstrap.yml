spring:
  application:
    name: data-element
  config:
    import: "nacos:${HAITONG_NACOS_DATA_ID:haitong-data-element.yml}?group=${HAITONG_NACOS_GROUP:DEFAULT_GROUP}"
  cloud:
    nacos:
      config:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:}"
        username: "${NACOS_USER:}"
        password: "${NACOS_PASSWORD:}"

server:
  address: ${HAITONG_BACKEND_BIND:127.0.0.1}
  port: ${HAITONG_BACKEND_PORT:8088}
spring:
  application:
    name: data-element
  main:
    allow-circular-references: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${HAITONG_CONTROL_JDBC_URL:jdbc:mysql://127.0.0.1:3306/baseline?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}"
    username: ${HAITONG_DB_USER:haitong}
    password: ${HAITONG_DB_PASSWORD}
    druid:
      initial-size: 1
      max-active: 24
      validation-query: SELECT 1
  redis:
    host: ${HAITONG_REDIS_HOST:127.0.0.1}
    port: ${HAITONG_REDIS_PORT:6379}
    database: ${HAITONG_REDIS_DATABASE:0}
    password: ${HAITONG_REDIS_PASSWORD:}
  kafka:
    listener:
      auto-startup: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
magic-api:
  web: /api/web
  show-sql: false
  sql-column-case: camel
  auto-import-module: db,IdGenerator,jsons,httpx,kafka,flowEs,flowRedis,flowDataSource,flowRuntime
  db-sync:
    enabled: false
    table-name: api_file_t
  resource:
    type: database
    tableName: api_file_t
  backup:
    enable: true
    table-name: api_backup_t
  page:
    page: current
    size: size
    default-page: 1
    default-size: 10
  response-code:
    success: 200
    invalid: 400
    exception: 500
  crud:
    logic-delete-column: is_del
    logic-delete-value: 1
  response: "{ code: code, message: message, data }"
sa-token:
  token-name: token
  timeout: 86400
  is-share: false
  is-log: false
  is-read-cookie: false
  is-write-cookie: false
  is-read-header: true
warm-flow:
  ui: false
  data-source-type: mysql
  logic_delete: false
nifi:
  monitor-enabled: false
  provenance-sync-enabled: false
  pipeline-migration:
    enabled: false
es:
  init:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    elasticsearch:
      enabled: false
upload:
  dir: ./data/upload
storage:
  root-dir: ./data
  error-root-dir: ./logs
data-element:
  tenant:
    enabled: true
    compatibility-auto-bind: false
    default-tenant-id: "8fb3fdba44d54a729098000000000001"
    database:
      enabled: true
      default-data-source-key: haitong
      tenant-bindings:
        "8fb3fdba44d54a729098000000000001": haitong
      data-sources:
        haitong:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: "${HAITONG_TENANT_JDBC_URL:jdbc:mysql://127.0.0.1:3306/baseline_haitong?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}"
          username: ${HAITONG_TENANT_DB_USER:${HAITONG_DB_USER:haitong}}
          password: ${HAITONG_TENANT_DB_PASSWORD:${HAITONG_DB_PASSWORD}}
  audit:
    files-path: ./logs/log-files
    spool-path: ./logs/audit-spool
    fingerprint-key-file: ./data/audit-fingerprint.key
idaas:
  protocol:
    jwk-file: ./data/keys/protocol-signing.jwk
logging:
  file:
    name: ./logs/backend.log

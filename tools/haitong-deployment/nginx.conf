# Run Nginx with the deployment directory as its prefix and this file as config.
events {}
http {
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    server {
        listen 8090;
        root www;
        index index.html;
        client_max_body_size 100m;
        location = / { try_files /index.html =404; }
        location = /haitong/deployment.js {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }
        location /haitong/ { try_files $uri $uri/ /haitong/index.html; }
        location ^~ /prod-api/api/web { return 404; }
        location ^~ /prod-api/nifi-ui { return 404; }
        location ^~ /prod-api/nifi-api { return 404; }
        location /prod-api/ {
            proxy_pass http://127.0.0.1:8088/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}

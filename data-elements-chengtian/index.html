<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="聚焦数据要素全流程操作与价值转化，覆盖管理、配置、操作与监控需求，开箱即用支持深度二次定制，大幅缩短数据要素类系统搭建与上线周期，精准赋能数据资产价值挖掘与落地转化。"
    />
    <meta name="keywords" content="数据要素,数据管理,数据配置,数据操作,数据监控" />
    <title>数据要素操作平台</title>
    <link rel="stylesheet" href="/src/styles/workspace-loading.css" />
    <style>
      html,
      body,
      #app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
    <!-- Object.hasOwn polyfill (ES2022) — @antv/x6 使用了此 API，Chrome<93 等低版本浏览器不支持 -->
    <script>
      if (!Object.hasOwn) {
        Object.hasOwn = function (obj, prop) {
          return Object.prototype.hasOwnProperty.call(obj, prop);
        };
      }
    </script>
    <!-- 同步更新 <title>，避免 tab 标题闪烁 -->
    <script>
      (function () {
        try {
          var cached = localStorage.getItem("systemName");
          window.__SYSTEM_NAME__ = cached
            ? (function () {
                try {
                  var p = JSON.parse(cached);
                  return typeof p === "string" ? p : "数据要素操作平台";
                } catch (_) {
                  return cached;
                }
              })()
            : "数据要素操作平台";
          document.title = window.__SYSTEM_NAME__;
        } catch (_) {
          window.__SYSTEM_NAME__ = "数据要素操作平台";
        }
      })();
    </script>
  </head>

  <body>
    <!-- 针对 IE：默认隐藏 -->
    <div
      id="ie-warning"
      style="
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 9999;
        display: none;
        padding: 15px;
        font-size: 16px;
        color: white;
        text-align: center;
        background: #ff4d4f;
      "
    >
      抱歉，本网站不支持 Internet Explorer 浏览器。
      <br />
      请使用 Chrome、Edge、Firefox 等现代浏览器访问。
    </div>

    <div id="app">
      <div class="workspace-loading">
        <div class="workspace-loading__panel" role="status">
          <span class="workspace-loading__mark" aria-hidden="true"></span>
          <span class="workspace-loading__label">正在加载页面</span>
          <span class="workspace-loading__track" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </body>
  <script>
    // 检测是否为 IE 浏览器
    function isIE() {
      return /msie|trident/.test(window.navigator.userAgent.toLowerCase());
    }

    if (isIE()) {
      // 显示针对 IE10/11 的提示
      document.getElementById("ie-warning").style.display = "block";
      document.getElementById("app").style.display = "none";
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</html>

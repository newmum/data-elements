<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万象3.2.1 · 定向样式预览</title><style>body{margin:0;background:#f3f3fa;color:#242339;font:14px/1.7 system-ui,sans-serif}header{padding:20px 28px;background:#fff;border-bottom:1px solid #e2e0ef;position:sticky;top:0}h1{font-size:22px;margin:0}p{margin:5px 0 12px;color:#65647b}button{padding:7px 14px;border-radius:7px;border:1px solid #d7d2e6;background:white;color:#493486;cursor:pointer;margin-right:8px}button.active{background:#7039e5;color:white}main{max-width:1600px;margin:18px auto;padding:0 20px}figure{margin:0;background:#fff;padding:12px;border:1px solid #e0deed;border-radius:12px}img{display:block;width:100%;height:auto}figcaption{padding:8px;color:#65647b}</style></head><body><header><h1>万象数据治理 3.2.1</h1><p>总览恢复上一版页头，数据库品牌使用上游原文件。以下为源码驱动隔离DOM截图，非完整React/Ant Design应用运行截图。</p><div id="pages"><button data-page="overview" class="active">治理总览</button><button data-page="sources">数据源管理</button><button data-page="brand">品牌原图</button></div><div style="margin-top:8px" id="themes"><button data-theme="light" class="active">浅色</button><button data-theme="dark">深色</button></div></header><main><figure><img id="view" src="overview-collapsed-light-1670.png" alt="治理总览页头还原预览"><figcaption id="caption">原始山形与环轨背景、简洁文案；其他模块保持3.2.0。</figcaption></figure></main><script>let page='overview',theme='light';function update(){document.getElementById('view').src=page==='brand'?'brand-icons-'+theme+'.png':page+'-collapsed-'+theme+'-1670.png';document.getElementById('view').alt=(page==='brand'?'数据库原图':page==='overview'?'治理总览':'数据源管理')+' · '+theme;document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page));document.querySelectorAll('[data-theme]').forEach(e=>e.classList.toggle('active',e.dataset.theme===theme));document.getElementById('caption').textContent=page==='brand'?'8种数据库：原文件、原色、等比显示。来源和许可见工程third-party目录。':page==='overview'?'总览头部恢复3.1.0，不显示额外亮点与宣传短句。':'数据源头图、文案、字段与操作保持3.2.0，仅替换品牌图标。';}document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{page=e.dataset.page;update()});document.querySelectorAll('[data-theme]').forEach(e=>e.onclick=()=>{theme=e.dataset.theme;update()});</script></body></html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="description" content="万象数据治理：元数据、数据标准、数据质量与统一 ER 数据建模。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3.2.0" />
    <title>万象数据治理</title>
    <script>
      // Resolve the user's explicit choice before paint. First launch is always light.
      try { var mode = localStorage.getItem('data-elements-wanxiang:theme') === 'dark' ? 'dark' : 'light'; document.documentElement.dataset.theme = mode; document.documentElement.style.colorScheme = mode; document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#131923' : '#f5f7fa'; } catch (_) {}
    </script>
    <style>html,body{margin:0;background:#f5f7fa}html[data-theme="dark"],html[data-theme="dark"] body{background:#131923}</style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
